name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Signed release + recovery / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.14'}
    env:
      PYTHONPATH: .
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Require actual selected-Python Tk runtime (no display)
        run: python -I scripts/check_tk_runtime.py
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=drkit --cov-report=term-missing:skip-covered
      - run: python scripts/code_map.py --check
      - run: python scripts/file_guide.py --check
      - run: python scripts/validate_repo.py
      - run: python scripts/demo.py
      - run: python scripts/benchmark.py
  offline:
    name: Actual no-uplink hash-locked wheel installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: |
          python -m pip download --only-binary=:all: --require-hashes -r requirements.lock --dest out/wheels
      - run: python scripts/offline_prepare.py
      - name: Bound official mirror access on the disposable Ubuntu runner
        if: runner.os == 'Linux'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test -f /etc/apt/apt-mirrors.txt
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Eq '^URIs:[[:space:]]+mirror[+]file:/etc/apt/apt-mirrors[.]txt[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^Signed-By:[[:space:]]+/usr/share/keyrings/ubuntu-archive-keyring[.]gpg[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          # Keep suites/components/keyrings unchanged; no Azure mirror or unsigned fallback.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          # Bound existing acquisition, not test budgets; explicitly add no retries.
          printf '%s\n' 'Acquire::Retries "0";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-portfolio-network >/dev/null
          apt_network_config="$(apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout)"
          printf '%s\n' "$apt_network_config"
          grep -Fx 'Acquire::Retries "0";' <<< "$apt_network_config"
          grep -Fx 'Acquire::http::Timeout "15";' <<< "$apt_network_config"
          grep -Fx 'Acquire::https::Timeout "15";' <<< "$apt_network_config"
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iproute2 shellcheck
      - run: bash -n scripts/offline.sh && shellcheck scripts/offline.sh
      - run: sudo --preserve-env=GITHUB_ACTIONS,PYTHONPATH env DRKIT_PYTHON="$(command -v python)" bash scripts/offline.sh --run-isolated-demo
  security:
    name: Locked graph + secrets + workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
      - run: python scripts/scanners.py gitleaks
      - run: python scripts/scanners.py actionlint
      - run: .tools/gitleaks git . --redact --no-banner
      - run: .tools/actionlint

  portable-windows:
    name: Windows / actual offline native workbench
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-native.lock
      - run: python -m pip check
      - run: python -m pip_audit -r requirements-native.lock --disable-pip --no-deps
      - name: Build actual patched runtime, project engines and original notices
        run: python scripts/build_native.py
      - name: Use compiled app controls, independent result oracles, export and two-process reopen
        run: python scripts/test_native_app.py
